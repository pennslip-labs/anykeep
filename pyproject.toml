[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anykeep"
version = "0.1.0"
description = "Local-first Google Keep to Anytype importer"
requires-python = ">=3.9"
dependencies = [
    "click==8.1.7",
    "requests==2.31.0",
    "pyyaml==6.0.1",
    "watchdog==3.0.0",
    "keyring==24.3.0",
]

[project.scripts]
anykeep = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]
